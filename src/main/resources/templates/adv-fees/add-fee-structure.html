<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"  th:replace="~{./base/base :: parent(~{::#addFeeStructureForm}, ~{::#title})}">
  <head>
    <title id="title">Add Fee Structure</title>
  </head>
  <body id="addFeeStructureForm">
    <main class="p-6">
      <div class="max-w-7xl mx-auto bg-white shadow-lg rounded-lg">
        <div
          class="p-6 border-b border-gray-200 flex items-center justify-center"
        >
          <h1
            class="text-3xl lg:text-2xl md:text-2xl sm:text-2xl pb-2 font-medium mt-2"
          >
            Add Fee Structure
          </h1>
        </div>

        <div>
          <section class="pt-10 pb-10">
            <div>
              <form
                class="max-w-sm mx-auto"
                th:action="@{/adv-fees/add-fee-structure}"
                method="post"
                th:object="${feeStructure}"
              >
                
                <!-- Class ID -->
                <!-- <div class="mb-5">
                  <label
                    for="classId"
                    class="block mb-2 text-sm font-medium text-gray-900 dark:text-white"
                    >Class ID:</label
                  >
                  <input
                    id="classId"
                    type="number"
                    name="classId"
                    th:value="${feeStructure.classId}"
                    class="shadow-sm bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5 dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white dark:focus:ring-blue-500 dark:focus:border-blue-500 dark:shadow-sm-light"
                    placeholder="Enter Class ID"
                    required
                  />
                </div> -->

                <!-- Fee Type -->
                <div class="mb-5">
                  <label
                    for="feeType"
                    class="block mb-2 text-sm font-medium text-gray-900 dark:text-white"
                    >Fee Type:</label
                  >
                  <input
                    id="feeType"
                    type="text"
                    name="feeType"
                    th:value="${feeStructure.feeType}"
                    class="shadow-sm bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5 dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white dark:focus:ring-blue-500 dark:focus:border-blue-500 dark:shadow-sm-light"
                    placeholder="Write your fee type name"
                    required
                  />
                </div>

                <!-- Academic Year -->
                <!-- <div class="mb-5">
                  <label
                    for="academicYear"
                    class="block mb-2 text-sm font-medium text-gray-900 dark:text-white"
                    >Academic Year:</label
                  >
                  <input
                    id="academicYear"
                    type="text"
                    name="academicYear"
                    class="shadow-sm bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5 dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white dark:focus:ring-blue-500 dark:focus:border-blue-500 dark:shadow-sm-light"
                    placeholder="Enter Academic Year like - 2024-2025"
                    required
                  />
                </div> -->

                <div class="mb-5">
                  <label
                    for="academicYear"
                    class="block mb-2 text-sm font-medium text-gray-900 dark:text-white"
                    >Academic Year:</label
                  >
                  <select
                    id="academicYear"
                    name="academicYear"
                    th:field="*{academicYear}"
                    class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5 dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white dark:focus:ring-blue-500 dark:focus:border-blue-500"
                  >
                    <option value="" selected>
                      -- Select Academic Year --
                    </option>
                    <option
                    class=""
                      th:each="academicYear : ${academicYears}"
                      th:value="${academicYear.id}"
                      th:text="${academicYear.startDate} + ' - ' + ${academicYear.endDate}"
                      th:classappend="${academicYear.isActive} ? 'text-green-700 font-medium' : ''"
                    > 
                  </option>
                  </select>
                </div>

                <!-- Fee Amount -->
                <div class="mb-5">
                  <label
                    for="amount"
                    class="block mb-2 text-sm font-medium text-gray-900 dark:text-white"
                    >Amount:</label
                  >
                  <input
                    id="amount"
                    type="number"
                    name="amount"
                    th:value="${feeStructure.amount}"
                    step="0.01"
                    class="shadow-sm bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5 dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white dark:focus:ring-blue-500 dark:focus:border-blue-500 dark:shadow-sm-light"
                    placeholder="Enter fee amount"
                    required
                  />
                </div>

                <!-- Fee Discription -->
                <div class="mb-5">
                  <label
                    for="description"
                    class="block mb-2 text-sm font-medium text-gray-900 dark:text-white"
                    >Description:</label
                  >
                  <textarea
                    id="description"
                    name="description"
                    th:value="${feeStructure.description}"
                    placeholder="Write fee description here......."
                    rows="4"
                    class="block p-2.5 w-full text-sm text-gray-900 bg-gray-50 rounded-lg border border-gray-300 focus:ring-blue-500 focus:border-blue-500 dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white dark:focus:ring-blue-500 dark:focus:border-blue-500"
                  ></textarea>
                </div>
                
                <!-- Fee Add Date -->
                <div class="mb-5">
                  <label
                    for="dueDate"
                    class="block mb-2 text-sm font-medium text-gray-900 dark:text-white"
                    >Add Date (dd-mm-yyyy):</label
                  >
                  <input
                    id="dueDate"
                    type="date"
                    name="dueDate"
                    th:value="${feeStructure.dueDate}"
                    class="shadow-sm bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5 dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white dark:focus:ring-blue-500 dark:focus:border-blue-500 dark:shadow-sm-light"
                    placeholder="Enter fee amount"
                    required
                  />
                </div>

                <!-- Submit Button -->
                <button
                  type="submit"
                  class="text-white bg-blue-700 hover:bg-blue-800 focus:ring-4 focus:outline-none focus:ring-blue-300 font-medium rounded-lg text-sm px-5 py-2.5 text-center dark:bg-blue-600 dark:hover:bg-blue-700 dark:focus:ring-blue-800"
                >
                  Add Structure
                </button>
              </form>

              <div class="flex justify-center items-center pt-10">
                <a
                  th:href="@{'/adv-fees/list-fee-structures'}"
                  type="button"
                  class="text-white bg-[#1da1f2] hover:bg-[#1da1f2]/90 focus:ring-4 focus:outline-none focus:ring-[#1da1f2]/50 font-medium rounded-lg text-sm px-4 py-2 text-center inline-flex items-center dark:focus:ring-[#1da1f2]/55 me-2 mb-2 pt-3 border-t-2 border-gray-800"
                >
                  <svg
                    class="w-6 h-6 me-1"
                    aria-hidden="true"
                    xmlns="http://www.w3.org/2000/svg"
                    width="24"
                    height="24"
                    fill="none"
                    viewBox="0 0 24 24"
                  >
                    <path
                      stroke="currentColor"
                      stroke-linecap="round"
                      stroke-linejoin="round"
                      stroke-width="2"
                      d="M5 12h14M5 12l4-4m-4 4 4 4"
                    />
                  </svg>

                  Back to List
                </a>
              </div>
            </div>
          </section>
        </div>
      </div>
    </main>

   </body>
</html>
