<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Allocate Fee</title>
</head>
<body>
    <h1>Allocate Fee</h1>
    <a th:href="'/'">Home</a>
    <form th:action="@{/fees/allocate}" method="post">
        <input type="hidden" th:name="studentId" th:value="${studentId}" />
        <label for="feeStructureId">Select Fee Structure:</label>
        <select id="feeStructureId" name="feeStructureId">
            <option th:each="structure : ${feeStructures}"
                    th:value="${structure.id}"
                    th:text="${structure.name} + ' (' + structure.amount + ')'"></option>
        </select>
        <br>
        <label for="discount">Discount:</label>
        <input type="number" id="discount" name="discount" min="0">
        <br>
        <button type="submit">Allocate</button>
    </form>
    <a th:href="@{'/adv-fees/list/' + ${studentId}}">Back to Fee List</a>
</body>
</html>
