<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <title>Register</title>
  </head>
  <body>
    <h1>Register</h1>

    <form th:action="@{/sign-up}" method="post" th:object="${user}">

      <div>
        <input
          type="text"
          th:field="*{email}"
          placeholder="Enter Email"
          required
        />
      </div>

      <div>
        <input
          type="password"
          th:field="*{password}"
          placeholder="Enter Password"
          required
        />
      </div>

      <div>
        <button type="submit">Register</button>
      </div>

    </form>
  </body>
</html>
