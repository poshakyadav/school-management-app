<!DOCTYPE html>
<html
  lang="en"
  xmlns:th="http://www.thymeleaf.org"
  th:fragment="parent(content, title)"
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title th:replace="${title}">School Management</title>
    <link rel="stylesheet" th:href="@{'/css/output.css'}" />
    <link
      href="https://cdn.jsdelivr.net/npm/flowbite@2.5.2/dist/flowbite.min.css"
      rel="stylesheet"
    />
  </head>
  <body>
    <!-- <h1>This is Base</h1> -->
    <!-- Common Header -->
    <section>
      <header>
        <nav
          th:replace="~{./dashboard-navbar/dashboard-navbar :: dashboardNavbar}"
        ></nav>
      </header>
    </section>

    <!-- Main Content -->
    <section th:replace="${content}"></section>

    <!-- Common Footer -->
  </body>
  <script src="https://cdn.jsdelivr.net/npm/flowbite@2.5.2/dist/flowbite.min.js"></script>
  <script th:href="@{'/js/script.js'}"></script>

  <script>
    // JavaScript to toggle the sidebar
    document
      .getElementById("openSidebarBtn")
      .addEventListener("click", function () {
        document
          .getElementById("sidebar")
          .classList.remove("-translate-x-full");
      });

    document
      .getElementById("closeSidebarBtn")
      .addEventListener("click", function () {
        document.getElementById("sidebar").classList.add("-translate-x-full");
      });
  </script>
</html>
