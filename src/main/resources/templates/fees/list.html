<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Fee List</title>
    <style>
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        table, th, td {
            border: 1px solid #ddd;
        }

        th, td {
            padding: 10px;
            text-align: center;
        }

        th {
            background-color: #f4f4f4;
        }

        tr:nth-child(even) {
            background-color: #f9f9f9;
        }

        tr:hover {
            background-color: #f1f1f1;
        }

        .actions a {
            margin: 0 5px;
            text-decoration: none;
            color: #007bff;
        }

        .actions a:hover {
            text-decoration: underline;
        }

        .add-btn {
            display: inline-block;
            margin-bottom: 10px;
            padding: 8px 15px;
            background-color: #28a745;
            color: #fff;
            text-decoration: none;
            border-radius: 5px;
        }

        .add-btn:hover {
            background-color: #218838;
        }
    </style>
</head>
<body>
    <h2>Fee Details for Student</h2>
    <a class="add-btn" th:href="@{/fees/add/{studentId}(studentId=${studentId})}">Add Fee</a>
    
    <table>
        <thead>
            <tr>
                <th>Fee ID</th>
                <th>Amount (₹)</th>
                <th>Due Date</th>
                <th>Status</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="fee : ${fees}">
                <td th:text="${fee.id}"></td>
                <td th:text="${#numbers.formatDecimal(fee.amount, 1, 2)}"></td>
                <td th:text="${fee.dueDate}"></td>
                <td th:text="${fee.status == 'paid' ? 'Paid' : 'Pending'}"></td>
                <td class="actions">
                    <a th:href="@{/fees/edit/{id}(id=${fee.id})}">Edit</a>
                    <a th:href="@{/fees/delete/{id}(id=${fee.id})}" 
                       onclick="return confirm('Are you sure you want to delete this fee?');">Delete</a>
                </td>
            </tr>
            <tr th:if="${fees.empty}">
                <td colspan="5">No fees found for this student.</td>
            </tr>
        </tbody>
    </table>
</body>
</html>
