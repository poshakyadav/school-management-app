<!DOCTYPE html>
<html
  xmlns:th="http://www.thymeleaf.org"
  th:replace="~{./base/base :: parent(~{::#sectionList}, ~{::#title})}"
>
  <head>
    <title id="title">Section List</title>
  </head>
  <body id="sectionList">
    <main class="p-6">
      <div class="max-w-7xl mx-auto bg-white shadow-lg rounded-lg">
        <div
          class="p-6 border-b border-gray-200 flex items-center justify-center"
        >
          <h1
            class="text-3xl lg:text-2xl md:text-2xl sm:text-2xl pb-2 font-medium mt-2"
          >
            See All Sections
          </h1>
        </div>

        <div>
          <div
            class="relative overflow-x-auto shadow-md sm:rounded-lg mx-5 my-5"
          >
            <table
              class="w-full text-sm text-left rtl:text-right text-gray-500 dark:text-gray-400"
            >
              <thead
                class="text-xs text-gray-700 uppercase bg-gray-50 dark:bg-gray-700 dark:text-gray-400"
              >
                <tr>
                  <th scope="col" class="px-6 py-3">Section ID</th>
                  <th scope="col" class="px-6 py-3">Section Name</th>
                  <th scope="col" class="px-6 py-3">Actions</th>
                </tr>
              </thead>
              <tbody>
                <tr th:each="section : ${sections}">
                  <td class="px-6 py-4" th:text="${section.id}"></td>
                  <td class="px-6 py-4" th:text="${section.name}"></td>

                  <td class="flex items-center px-6 py-4 actions">
                    <a
                      class="font-medium text-blue-600 dark:text-blue-500 hover:underline"
                      th:href="@{/sections/edit/{id}(id=${section.id})}"
                      >Edit</a
                    >
                    <a
                      class="font-medium text-red-600 dark:text-red-500 hover:underline ms-3"
                      th:href="@{/sections/delete/{id}(id=${section.id})}"
                      onclick="return confirm('Are you sure you want to delete this section?');"
                      >Delete</a
                    >
                  </td>
                </tr>
                <tr th:if="${sections.empty}">
                  <td class="text-2xl text-center" colspan="10">
                    No section found.
                  </td>
                </tr>
              </tbody>
            </table>
          </div>

          <div class="pb-10 pt-4">
            <a
              th:href="@{/sections/add}"
              type="button"
              class="text-white mx-5 bg-[#1da1f2] hover:bg-[#1da1f2]/90 focus:ring-4 focus:outline-none focus:ring-[#1da1f2]/50 font-medium rounded-lg text-sm px-4 py-2 text-center inline-flex items-center dark:focus:ring-[#1da1f2]/55 me-2 mb-2"
            >
              <p class="mx-1">Add New Section</p>
              <svg
                class="w-6 h-6 me-2"
                aria-hidden="true"
                xmlns="http://www.w3.org/2000/svg"
                width="24"
                height="24"
                fill="none"
                viewBox="0 0 24 24"
              >
                <path
                  stroke="currentColor"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  d="M5 12h14m-7 7V5"
                />
              </svg>
            </a>
          </div>
        </div>
      </div>
    </main>
  </body>
</html>
