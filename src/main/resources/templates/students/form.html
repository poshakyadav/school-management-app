<!DOCTYPE html>
<html
  xmlns:th="http://www.thymeleaf.org"
  th:replace="~{./base/base :: parent(~{::#addStudentForm}, ~{::#title})}"
>
  <head>
    <meta charset="UTF-8" />
    <title id="title">Student Form</title>
  </head>
  <body id="addStudentForm">
    <main class="p-6">
      <div class="max-w-7xl mx-auto bg-white shadow-lg rounded-lg">
        <div class="p-6 border-b border-gray-200 flex items-center justify-center">
          
          <h1 class="text-3xl lg:text-2xl md:text-2xl sm:text-2xl   pb-2 font-medium mt-2">Add New Student</h1>
        </div>

        <div>
          <section class="pt-10 pb-10">
            <div>
              <form
                class="max-w-md mx-auto mb-10 px-4"
                th:action="@{/students/add}"
                method="post"
                th:object="${student}"
              >

                <!-- First Name and Last Name -->
                <div class="grid md:grid-cols-2 md:gap-6">
                  <!-- First Name -->
                  <div class="relative z-0 w-full mb-5 group">
                    <input
                      th:field="*{firstName}"
                      type="text"
                      id="floating_first_name"
                      class="block py-2.5 px-0 w-full text-sm text-gray-900 bg-transparent border-0 border-b-2 border-gray-300 appearance-none dark:text-white dark:border-gray-600 dark:focus:border-blue-500 focus:outline-none focus:ring-0 focus:border-blue-600 peer"
                      placeholder=" "
                      required
                    />
                    <label
                      for="floating_first_name"
                      class="peer-focus:font-medium absolute text-sm text-gray-500 dark:text-gray-400 duration-300 transform -translate-y-6 scale-75 top-3 -z-10 origin-[0] peer-focus:start-0 rtl:peer-focus:translate-x-1/4 peer-focus:text-blue-600 peer-focus:dark:text-blue-500 peer-placeholder-shown:scale-100 peer-placeholder-shown:translate-y-0 peer-focus:scale-75 peer-focus:-translate-y-6"
                      >First name</label
                    >
                  </div>

                  <!-- Last Name -->
                  <div class="relative z-0 w-full mb-5 group">
                    <input
                      th:field="*{lastName}"
                      type="text"
                      id="floating_last_name"
                      class="block py-2.5 px-0 w-full text-sm text-gray-900 bg-transparent border-0 border-b-2 border-gray-300 appearance-none dark:text-white dark:border-gray-600 dark:focus:border-blue-500 focus:outline-none focus:ring-0 focus:border-blue-600 peer"
                      placeholder=" "
                      required
                    />
                    <label
                      for="floating_last_name"
                      class="peer-focus:font-medium absolute text-sm text-gray-500 dark:text-gray-400 duration-300 transform -translate-y-6 scale-75 top-3 -z-10 origin-[0] peer-focus:start-0 rtl:peer-focus:translate-x-1/4 peer-focus:text-blue-600 peer-focus:dark:text-blue-500 peer-placeholder-shown:scale-100 peer-placeholder-shown:translate-y-0 peer-focus:scale-75 peer-focus:-translate-y-6"
                      >Last name</label
                    >
                  </div>
                </div>

                <!-- Enter Email -->
                <div class="relative z-0 w-full mb-5 group">
                  <input
                    th:field="*{email}"
                    type="email"
                    id="floating_email"
                    class="block py-2.5 px-0 w-full text-sm text-gray-900 bg-transparent border-0 border-b-2 border-gray-300 appearance-none dark:text-white dark:border-gray-600 dark:focus:border-blue-500 focus:outline-none focus:ring-0 focus:border-blue-600 peer"
                    placeholder=" "
                    required
                  />
                  <label
                    for="floating_email"
                    class="peer-focus:font-medium absolute text-sm text-gray-500 dark:text-gray-400 duration-300 transform -translate-y-6 scale-75 top-3 -z-10 origin-[0] peer-focus:start-0 rtl:peer-focus:translate-x-1/4 rtl:peer-focus:left-auto peer-focus:text-blue-600 peer-focus:dark:text-blue-500 peer-placeholder-shown:scale-100 peer-placeholder-shown:translate-y-0 peer-focus:scale-75 peer-focus:-translate-y-6"
                    >Email address</label
                  >
                </div>

                <!-- Enter Password -->
                <div class="relative z-0 w-full mb-5 group">
                  <input
                    th:field="*{password}"
                    type="password"
                    id="floating_password"
                    class="block py-2.5 px-0 w-full text-sm text-gray-900 bg-transparent border-0 border-b-2 border-gray-300 appearance-none dark:text-white dark:border-gray-600 dark:focus:border-blue-500 focus:outline-none focus:ring-0 focus:border-blue-600 peer"
                    placeholder=" "
                    required
                  />
                  <label
                    for="floating_password"
                    class="peer-focus:font-medium absolute text-sm text-gray-500 dark:text-gray-400 duration-300 transform -translate-y-6 scale-75 top-3 -z-10 origin-[0] peer-focus:start-0 rtl:peer-focus:translate-x-1/4 peer-focus:text-blue-600 peer-focus:dark:text-blue-500 peer-placeholder-shown:scale-100 peer-placeholder-shown:translate-y-0 peer-focus:scale-75 peer-focus:-translate-y-6"
                    >Password</label
                  >
                </div>

                <!-- Student Phone Number -->
                <div class="relative z-0 w-full mb-5 group">
                  <input
                    th:field="*{phoneNum}"
                    type="tel"
                    name="floating_phone"
                    id="floating_phone"
                    class="block py-2.5 px-0 w-full text-sm text-gray-900 bg-transparent border-0 border-b-2 border-gray-300 appearance-none dark:text-white dark:border-gray-600 dark:focus:border-blue-500 focus:outline-none focus:ring-0 focus:border-blue-600 peer"
                    placeholder=" "
                    required
                  />
                  <label
                    for="floating_phone"
                    class="peer-focus:font-medium absolute text-sm text-gray-500 dark:text-gray-400 duration-300 transform -translate-y-6 scale-75 top-3 -z-10 origin-[0] peer-focus:start-0 rtl:peer-focus:translate-x-1/4 peer-focus:text-blue-600 peer-focus:dark:text-blue-500 peer-placeholder-shown:scale-100 peer-placeholder-shown:translate-y-0 peer-focus:scale-75 peer-focus:-translate-y-6"
                    >Phone number (+91 9876543212)</label
                  >
                </div>

                <!-- Date of Birth -->
                <div class="flex flex-col space-y-2">
                  <label
                    for="dateOfBirth"
                    class="text-sm font-medium text-gray-700"
                  >
                    Date of Birth:
                  </label>
                  <input
                    type="date"
                    id="dateOfBirth"
                    th:field="*{dateOfBirth}"
                    required
                    class="px-3 py-2 border border-gray-300 rounded-lg shadow-sm focus:ring-indigo-500 focus:border-indigo-500 text-gray-900"
                  />
                </div>

                <!-- Select Student Class -->
                <div class="relative z-0 w-full mb-5 group">
                  <label
                    for="large"
                    class="block mb-2 text-base font-medium text-gray-700 dark:text-white"
                    >Student Class</label
                  >
                  <select
                    th:field="*{studentClass}"
                    id="large"
                    class="block w-full px-4 py-3 text-base text-gray-900 border border-gray-300 rounded-lg bg-gray-50 focus:ring-blue-500 focus:border-blue-500 dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white dark:focus:ring-blue-500 dark:focus:border-blue-500"
                    required
                  >
                    <option value="" selected>Select class</option>
                    <option
                      th:each="class : ${studentClasses}"
                      th:value="${class.id}"
                      th:text="${class.name}"
                    ></option>
                  </select>
                </div>

                <!-- Select Student Section -->
                <div class="relative z-0 w-full mb-5 group">
                  <label
                    for="large"
                    class="block mb-2 text-sm font-medium text-gray-700 dark:text-white"
                    >Student Section</label
                  >
                  <select
                    th:field="*{section}"
                    id="large"
                    class="bg-gray-50 border border-gray-300 text-gray-900 mb-6 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5 dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white dark:focus:ring-blue-500 dark:focus:border-blue-500"
                    required
                  >
                    <option value="" selected>Select section</option>
                    <option
                      th:each="section : ${sections}"
                      th:value="${section.id}"
                      th:text="${section.name}"
                    ></option>
                  </select>
                </div>

                <!-- Select Academic Year -->
                <div class="mb-5">
                  <label
                    for="academicYear"
                    class="block mb-2 text-sm font-medium text-gray-900 dark:text-white"
                    >Academic Year:</label
                  >
                  <select
                    id="academicYear"
                    name="academicYear"
                    th:field="*{academicYear}"
                    class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5 dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white dark:focus:ring-blue-500 dark:focus:border-blue-500"
                  >
                    <option value="" selected>
                      -- Select Academic Year --
                    </option>
                    <option
                    class=""
                      th:each="academicYear : ${academicYears}"
                      th:value="${academicYear.id}"
                      th:text="${academicYear.startDate} + ' - ' + ${academicYear.endDate}"
                      th:classappend="${academicYear.isActive} ? 'text-green-700 font-medium' : ''"
                    > 
                  </option>
                  </select>
                </div>


                <button
                  type="submit"
                  class="text-white bg-blue-700 hover:bg-blue-800 focus:ring-4 focus:outline-none focus:ring-blue-300 font-medium rounded-lg text-sm w-full sm:w-auto px-5 py-2.5 text-center dark:bg-blue-600 dark:hover:bg-blue-700 dark:focus:ring-blue-800"
                >
                  Submit
                </button>
              </form>
            </div>
          </section>
        </div>
      </div>
    </main>
  </body>
</html>
